data:
  train_dir: "/workspace/dataset/output/dataset"
  train_metainfo_path: "/workspace/dataset/output/dataset/train_metainfo.json"
  val_dir: "/workspace/dataset/output/dataset"
  val_metainfo_path: "/workspace/dataset/output/dataset/val_metainfo.json"
  n_mask_channels: 0

training:
  epochs: 50
  batch_size: 320
  learning_rate: 0.0003
  num_workers: 32
  gradient_accumulation_steps: 1
  save_dir: "./checkpoints"
  vis_dir: "./vis_results"
  early_stopping_patience: 5
  warmup_epochs: 5

model:
  backbone: "convnext_small"
  embed_dim: 1024
  checkpoint: "./checkpoints/neat-water-16/epoch_4.pth.tar" 
  resume: true
  image_size: 224
  in_channels: 3

loss:
  temperature: 0.07

use_wandb: True
