data:
  train_dir: "/workspace/main"
  train_metainfo_path: "/workspace/main/train_metainfo.json"
  val_dir: "/workspace/main"
  val_metainfo_path: "/workspace/main/val_metainfo.json"
  negative_count: 31
  
  n_mask_channels: 0

training:
  epochs: 20
  batch_size: 48          # => 한 번에 anchor 8개
  learning_rate: 0.0001
  num_workers: 8
  gradient_accumulation_steps: 1
  save_dir: "./checkpoints"
  vis_dir: "./vis_results"
  early_stopping_patience: 3

model:
  pretrained_model_name: "openai/clip-vit-base-patch32"
  checkpoint: "./checkpoints/last_ckpt.pth.tar"
  resume: false
  image_size: 224
  in_channels: 3

loss:
  margin: 1.0
  distance_metric: "euclidean"

use_wandb: True