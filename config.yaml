data:
    train_dir: "/workspace/dataset"
    train_metainfo_path: "/workspace/dataset/train_metainfo.json"
    val_dir: "/workspace/dataset"
    val_metainfo_path: "/workspace/dataset/val_metainfo.json"
    brandinfo_path: "/workspace/dataset/brandInfo.json"
    metainfo_path: "/workspace/dataset/metainfo.json"
    n_mask_channels: 0

training:
    epochs: 100 # 43보다 충분히 큰 값으로 설정
    batch_size: 1024
    learning_rate: 0.001    
    num_workers: 4 # vCPU 8개에 맞춤
    gradient_accumulation_steps: 1
    save_dir: "./checkpoints"
    vis_dir: "./vis_results"
    early_stopping_patience: 10
    warmup_epochs: 5         # 더 짧은 웜업
    eval_interval: 1 # 몇 에폭마다 평가할지
    save_interval: 1 # 몇 에폭마다 체크포인트 저장할지
    visualization_interval: 100 # 몇 스텝마다 시각화할지
    log_interval: 10 # 몇 스텝마다 로그 기록할지
    mixed_precision: true # 혼합 정밀도 사용

model:
    backbone_wear: "convnext_tiny"  # 착용 이미지용 백본
    backbone_prod: "convnext_tiny"  # 상품 이미지용 백본
    embed_dim: 512
    checkpoint: "/workspace/train/checkpoints/visionary-monkey-18/best_model.pth.tar"
    resume: false
    image_size: 384
    in_channels: 3
    use_timm: false

loss:
    temperature: 0.07
    hard_mining: false

memory_bank:
    enabled: false  # 메모리 뱅크 활성화
    size: 8192 # 더 큰 사이즈로 설정
    momentum: 0.99
    start_epoch: 0 # 즉시 사용 시작

optimizer:
    type: "AdamW"  # LARS 대신 AdamW 사용
    weight_decay: 1e-5

augmentation:
    color_jitter_strength: 0.6
    use_random_resize_crop: true
    min_scale: 0.65
    crop_ratio_range: [0.85, 1.15]
    use_random_erasing: true
    erasing_prob: 0.3
    use_gaussian_blur: true
    blur_prob: 0.2

wandb:
    enabled: true
    project_name: "fashion-supcon-a100"
    run_name: null # 자동 생성됨
    tags: ["a100", "supcon", "single-model"]
    # 상세 로깅 설정
    log_model: true # 모델 가중치를 WandB에 로깅
    log_gradients: true # 그라디언트 히스토그램 로깅
    log_memory: true # 메모리 사용량 로깅
    log_embedding_samples: 200 # 임베딩 시각화를 위한 샘플 수
