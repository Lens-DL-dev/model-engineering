data:
    train_dir: "/workspace/dataset/output/dataset"
    train_metainfo_path: "/workspace/dataset/output/dataset/train_metainfo.json"
    val_dir: "/workspace/dataset/output/dataset"
    val_metainfo_path: "/workspace/dataset/output/dataset/val_metainfo.json"
    n_mask_channels: 0

training:
    epochs: 50
    batch_size: 320
    learning_rate: 0.0001
    num_workers: 24
    gradient_accumulation_steps: 1
    save_dir: "./checkpoints"
    vis_dir: "./vis_results"
    early_stopping_patience: 5
    warmup_epochs: 5

model:
    backbone: "convnext_tiny"
    embed_dim: 512
    checkpoint: "./checkpoints/neat-water-16/epoch_4.pth.tar"
    resume: true
    image_size: 384
    in_channels: 3

loss:
    temperature: 0.07
    hard_mining: true
    memory_bank_size: 4096 # 메모리 뱅크 크기

use_wandb: True

optimizer:
    type: "lars" # 빠른 수렴을 위한 LARS 옵티마이저 계속 사용
    momentum: 0.9
    weight_decay: 1e-5
    trust_coefficient: 0.001

augmentation:
    color_jitter_strength: 0.5 # 더 강한 augmentation 적용
    use_random_resize_crop: true
    min_scale: 0.85 # 원본 이미지에 더 가깝게 설정 (0.6 -> 0.85)
    crop_ratio_range: [0.95, 1.05] # 거의 정사각형에 가까운 비율로 유지
